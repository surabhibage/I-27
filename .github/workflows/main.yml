name: Job Board Monitor

on:
  schedule:
    # Runs twice per hour
    - cron: '21,51 * * * *'

  # Lets you test it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create state directory
        run: mkdir -p job_state

      - name: Download latest job boards
        run: |
          curl -L \
            "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README.md" \
            -o /tmp/latest_summer.md

          curl -L \
            "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/README-Off-Season.md" \
            -o /tmp/latest_offseason.md

      - name: Detect new Summer jobs
        id: summer
        run: |
          if [ ! -f job_state/README.md ]; then
            echo "First run - creating baseline."
            cp /tmp/latest_summer.md job_state/README.md
            echo "found=false" >> $GITHUB_OUTPUT
          else
            grep -Fvx -f job_state/README.md /tmp/latest_summer.md \
              | grep '^|' \
              > /tmp/new_summer_jobs.txt || true

            if [ -s /tmp/new_summer_jobs.txt ]; then
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Detect new Off-Season jobs
        id: offseason
        run: |
          if [ ! -f job_state/README-Off-Season.md ]; then
            echo "First run - creating baseline."
            cp /tmp/latest_offseason.md job_state/README-Off-Season.md
            echo "found=false" >> $GITHUB_OUTPUT
          else
            grep -Fvx -f job_state/README-Off-Season.md /tmp/latest_offseason.md \
              | grep '^|' \
              > /tmp/new_offseason_jobs.txt || true

            if [ -s /tmp/new_offseason_jobs.txt ]; then
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Debug Summer jobs
        if: steps.summer.outputs.found == 'true'
        run: |
          echo "=== NEW SUMMER JOBS ==="
          head -20 /tmp/new_summer_jobs.txt

      - name: Debug Off-Season jobs
        if: steps.offseason.outputs.found == 'true'
        run: |
          echo "=== NEW OFF-SEASON JOBS ==="
          head -20 /tmp/new_offseason_jobs.txt

      - name: Notify Discord - Summer
        if: steps.summer.outputs.found == 'true'
        run: |
          JOBS=$(head -c 1600 /tmp/new_summer_jobs.txt)

          jq -n \
            --arg content "🌞 **New Summer 2027 internships**"$'\n\n'"$JOBS" \
            '{content: $content}' \
            > /tmp/summer_payload.json

          curl \
            -H "Content-Type: application/json" \
            -d @/tmp/summer_payload.json \
            "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord - Off Season
        if: steps.offseason.outputs.found == 'true'
        run: |
          JOBS=$(head -c 1600 /tmp/new_offseason_jobs.txt)

          jq -n \
            --arg content "🍂 **New Off-Season internships**"$'\n\n'"$JOBS" \
            '{content: $content}' \
            > /tmp/offseason_payload.json

          curl \
            -H "Content-Type: application/json" \
            -d @/tmp/offseason_payload.json \
            "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save latest job boards
        run: |
          cp /tmp/latest_summer.md job_state/README.md
          cp /tmp/latest_offseason.md job_state/README-Off-Season.md

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add job_state/

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update job board state"
            git push
          fi
